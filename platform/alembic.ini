# Used by the alembic command line (revision --autogenerate, upgrade, ...). The services themselves
# do not read this file: ailab_platform/migrate.py builds the configuration in code.
#
#   cd platform
#   AILAB_DATABASE_URL=sqlite:////tmp/x.db .venv/bin/alembic upgrade head
#   .venv/bin/alembic revision --autogenerate -m "what changed"   (against a DB at the current head)
[alembic]
script_location = ailab_platform/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
