# Platform services on the single-node k3s (dev profile).
# Prereqs:
#   (repo root) docker build -f platform/deploy/Dockerfile -t ailab-platform:lite .
#   docker save ailab-platform:lite | sudo k3s ctr -n k8s.io images import -
#   bash scripts/osb_up.sh         # OpenSandbox dev server on the host :8090
# Not in this file: Secrets (`bash scripts/k8s_secrets.sh`: random tokens + model keys) and the model
# catalog ConfigMap (`bash scripts/k8s_models.sh`: platform/models.toml). Run both before applying.
# Apply: sudo k3s kubectl apply -f deploy/k8s/platform.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: platform
data:
  AILAB_ENV: k3s
  AILAB_ADMIN_USERNAME: admin  # the first Portal account; its password is AILAB_ADMIN_PASSWORD in platform-secrets
  AILAB_REDIS_URL: redis://platform-redis:6379/0
  AILAB_DATABASE_URL: sqlite:////data/platform.db
  AILAB_STORAGE_ROOT: /data/storage
  AILAB_SANDBOX_PROVIDER: opensandbox
  AILAB_OSB_DOMAIN: 127.0.0.1:8090
  AILAB_SANDBOX_IMAGE: harbor.ailab.local/sandbox/sbx-office:lite
  AILAB_MAX_AGENT_STEPS: "24"
  AILAB_MAX_SANDBOXES: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-redis
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-redis}
  template:
    metadata:
      labels: {app: platform-redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{containerPort: 6379}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: platform-redis
  namespace: platform
spec:
  selector: {app: platform-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-api}
  template:
    metadata:
      labels: {app: platform-api}
    spec:
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: fix-data-perms
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["sh", "-c", "mkdir -p /data/storage && chown -R 10001:10001 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: api
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["uvicorn", "ailab_platform.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef: {name: platform-config}
            - configMapRef: {name: platform-auth, optional: true}  # AILAB_REGISTRATION, set by deploy.sh --registration
            - secretRef: {name: platform-secrets}
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: models, mountPath: /etc/ailab, readOnly: true}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: platform-data}
        - name: models
          configMap: {name: platform-models}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: platform
spec:
  type: NodePort
  selector: {app: platform-api}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-broker
  namespace: platform
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: platform-broker}
  template:
    metadata:
      labels: {app: platform-broker}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: fix-data-perms
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["sh", "-c", "mkdir -p /data/storage && chown -R 10001:10001 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: broker
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["uvicorn", "ailab_platform.broker.main:app", "--host", "0.0.0.0", "--port", "8081"]
          envFrom:
            - configMapRef: {name: platform-config}
            - configMapRef: {name: platform-auth, optional: true}  # AILAB_REGISTRATION, set by deploy.sh --registration
            - secretRef: {name: platform-secrets}
          env:
            - name: AILAB_API_BASE_URL
              value: http://127.0.0.1:30080
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: platform-data}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-agent
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-agent}
  template:
    metadata:
      labels: {app: platform-agent}
    spec:
      containers:
        - name: agent
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["uvicorn", "ailab_platform.agent.main:app", "--host", "0.0.0.0", "--port", "8082"]
          envFrom:
            - configMapRef: {name: platform-config}
            - configMapRef: {name: platform-auth, optional: true}  # AILAB_REGISTRATION, set by deploy.sh --registration
            - secretRef: {name: platform-secrets}
          env:
            - name: HOST_IP
              valueFrom:
                fieldRef: {fieldPath: status.hostIP}
            - name: AILAB_API_BASE_URL
              value: http://platform-api:8080
            - name: AILAB_BROKER_BASE_URL
              value: http://$(HOST_IP):8081
          ports: [{containerPort: 8082}]
          volumeMounts:
            - {name: models, mountPath: /etc/ailab, readOnly: true}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8082}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: models
          configMap: {name: platform-models}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-worker
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-worker}
  template:
    metadata:
      labels: {app: platform-worker}
    spec:
      securityContext: {fsGroup: 10001}
      initContainers:
        - name: fix-data-perms
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["sh", "-c", "mkdir -p /data/storage && chown -R 10001:10001 /data"]
          securityContext: {runAsUser: 0}
          volumeMounts: [{name: data, mountPath: /data}]
      containers:
        - name: worker
          image: ailab-platform:lite
          imagePullPolicy: Never
          command: ["uvicorn", "ailab_platform.worker.main:app", "--host", "0.0.0.0", "--port", "8083"]
          envFrom:
            - configMapRef: {name: platform-config}
            - configMapRef: {name: platform-auth, optional: true}  # AILAB_REGISTRATION, set by deploy.sh --registration
            - secretRef: {name: platform-secrets}
          env:
            - name: AILAB_API_BASE_URL
              value: http://platform-api:8080
          ports: [{containerPort: 8083}]
          volumeMounts: [{name: data, mountPath: /data}]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: 8083}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: platform-data}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-agent
  namespace: platform
spec:
  selector: {app: platform-agent}
  ports: [{name: http, port: 8082, targetPort: 8082}]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-worker
  namespace: platform
spec:
  selector: {app: platform-worker}
  ports: [{name: http, port: 8083, targetPort: 8083}]
