[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ailab-platform"
version = "0.1.0"
description = "AILab lite platform services: API, agent, sandbox broker, file worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "boto3>=1.34",
  "pypdf>=5",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.17.1"]
opensandbox = ["opensandbox==1.1.1"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["ailab_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["portal"]

[tool.ruff.lint]
# FastAPI's Depends()/File() markers are call expressions in argument defaults by design.
select = ["E", "F", "I", "UP", "RUF"]
ignore = [
  "RUF001",  # Chinese text has full-width punctuation by design
  "RUF012",  # mutable class attributes are intentional in the ORM/Pydantic models
]

[tool.coverage.run]
source = ["ailab_platform"]

[tool.coverage.report]
show_missing = true
fail_under = 70
