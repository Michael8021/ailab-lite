# 沙箱命名空间：两边共用的部分。配额数值和 RuntimeClass 名由 overlay 覆盖。
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
  labels:
    ailab.io/zone: sandbox
---
# 默认拒绝所有出入流量（大集群在此之上还有 OpenSandbox 出网 sidecar；gVisor 下 sidecar 不可用，只靠这一层）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 只放行 OpenSandbox ingress 网关访问 execd（端口在 T2 按实际 chart 校正）
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway-to-execd
  namespace: sandbox
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opensandbox-system
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: sandbox
spec:
  hard:
    pods: "50"
