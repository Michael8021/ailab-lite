name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Exercise the real RedisQueue branch (the default run skips it).
      AILAB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/constraints.txt
      - name: Lockfile is consistent with pyproject.toml
        run: bash scripts/lock_deps.sh --check
      - name: Install (pinned)
        run: pip install -c constraints.txt -e '.[dev]'
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q --cov=ailab_platform --cov-report=term-missing

  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/portal/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: shellcheck -S warning deploy.sh tests/*.sh platform/scripts/*.sh
